name: CI

# Checks every pull request before it can be merged. Nothing is published from here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --nologo

      - name: Publish (proves the static site builds)
        run: dotnet publish src/TodoList.Web -c Release -o release --nologo
