<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoList</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type=text] { flex: 1; padding: .5rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: .5rem; padding: .5rem 0; border-bottom: 1px solid #ddd; }
    li.done .title { text-decoration: line-through; color: #888; }
    .title { flex: 1; }
  </style>
</head>
<body>
  <h1>TodoList</h1>
  <form id="form">
    <input id="title" type="text" placeholder="Nova tarefa" required>
    <button type="submit">Adicionar</button>
  </form>
  <ul id="list"></ul>

  <script>
    const list = document.getElementById('list');

    async function load() {
      const todos = await (await fetch('/api/todos')).json();
      list.innerHTML = '';
      for (const t of todos) {
        const li = document.createElement('li');
        li.className = t.done ? 'done' : '';
        li.dataset.id = t.id;

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = t.done;
        cb.onchange = async () => { await fetch(`/api/todos/${t.id}/toggle`, { method: 'PUT' }); load(); };

        const title = document.createElement('span');
        title.className = 'title';
        title.textContent = t.title;

        const del = document.createElement('button');
        del.textContent = 'Remover';
        del.onclick = async () => { await fetch(`/api/todos/${t.id}`, { method: 'DELETE' }); load(); };

        li.append(cb, title, del);
        list.append(li);
      }
    }

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('title');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      load();
    };

    load();
  </script>
</body>
</html>
